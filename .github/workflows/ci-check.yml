name: CI Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WindowsEdgeLight\WindowsEdgeLight.csproj

      - name: Build
        run: dotnet build WindowsEdgeLight\WindowsEdgeLight.csproj --configuration Release --no-restore
