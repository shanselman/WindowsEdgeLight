version: 2

updates:
  # Keep NuGet packages up to date
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies

  # Keep GitHub Actions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
